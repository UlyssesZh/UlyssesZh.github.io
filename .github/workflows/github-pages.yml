name: Deploy to pages

on:
  workflow_dispatch: {}
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        id: setup-ruby
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        id: setup-ghc
        with:
          ghc-version: '9.10'

      - name: Restore Cabal cache
        uses: actions/cache/restore@v6
        id: cabal-cache-restore
        with:
          path: |
            ~/.cabal/packages
            ${{ steps.setup-ghc.outputs.cabal-store }}
            _lib/pandoc-bridge/dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('**/cabal.project.freeze') }}

      - name: Update Cabal package index
        if: steps.cabal-cache-restore.outputs.cache-hit != 'true'
        run: cabal update

      - name: Build libraries
        run: bundle exec rake build_libs

      - name: Save Cabal cache
        uses: actions/cache/save@v6
        if: steps.cabal-cache-restore.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cabal/packages
            ${{ steps.setup-ghc.outputs.cabal-store }}
            _lib/pandoc-bridge/dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('**/cabal.project.freeze') }}

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Jekyll build
        run: bundle exec rake
        env:
          JEKYLL_URL: ${{ steps.pages.outputs.origin }}
          JEKYLL_BASEURL: ${{ steps.pages.outputs.base_path }}
          JEKYLL_DOMAIN: ${{ steps.pages.outputs.host }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Upload
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
